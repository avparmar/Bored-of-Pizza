<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bored of Pizza (prototype)</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="clock">10:00</div>
        <div id="headline">Welcome to the food court.</div>
        <div id="speed-controls">
          <button id="btn-pause" title="Pause (P)">⏸</button>
          <select id="speed" title="Game speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
            <option value="8">8×</option>
          </select>
          <button id="btn-debug" title="Debug panel (`)">⚙</button>
        </div>
      </header>

      <aside id="left" class="side">
        <section class="panel" id="board-panel">
          <h2>Recipes <span class="hint">▲▼ = vs yours</span></h2>
          <table id="board"></table>
        </section>

        <section class="panel" id="leaderboard-panel">
          <h2>Leaderboard</h2>
          <ol id="leaderboard"></ol>
        </section>

        <section class="panel" id="intel-panel">
          <h2>Intel history <span id="intel-rate"></span></h2>
          <details id="intel-history-wrap" open>
            <summary>History (<span id="intel-count">0</span>)</summary>
            <ol id="intel-history"></ol>
          </details>
        </section>
      </aside>

      <main id="court-wrap">
        <div id="canvas-box">
          <div id="pregame" class="hidden">
            <span>🔒 <b>Blind pick</b>: set your opening recipe. Rivals' recipes stay hidden until doors open in <b id="pregame-left">20</b>s. <small>(Space applies; Space again = Ready)</small></span>
            <button id="btn-ready" class="primary">Ready</button>
          </div>
          <div id="trend-banner" class="hidden"></div>
          <div id="nudge" class="hidden"></div>
          <canvas id="court"></canvas>
        </div>
        <div id="intel-strip">
          <div id="intel-latest"></div>
        </div>
      </main>

      <aside id="right" class="side">
        <section class="panel" id="recipe-panel">
          <h2>Your recipe <span id="recipe-status"></span></h2>
          <div id="tip-meter"></div>
          <div id="tipoff"></div>
          <div id="recipe-rows"></div>
          <div class="recipe-actions">
            <button id="btn-apply" class="primary" disabled>Apply <kbd>Space</kbd></button>
            <button id="btn-reset" disabled>Reset <kbd>Esc</kbd></button>
          </div>
        </section>
      </aside>


    </div>

    <div id="debug" class="hidden">
      <h2>Debug</h2>
      <label>Seats
        <div id="seat-selects"></div>
      </label>
      <label>Magnitude
        <select id="dbg-magnitude">
          <option value="none">A: direction only</option>
          <option value="all">B: magnitude everywhere</option>
          <option value="own">C: magnitude on own pizza</option>
        </select>
      </label>
      <label>Bot skill
        <select id="dbg-skill">
          <option value="human">Human-like (look every 2s, react late)</option>
          <option value="superhuman">Superhuman</option>
        </select>
      </label>
      <label>Tip steepness k (lower = gentler) <input id="dbg-tipk" type="number" step="0.01" min="0.05" value="0.35" /></label>
      <label>Customer share floor / cap
        <div class="row"><input id="dbg-floor" type="number" step="0.05" min="0" max="0.25" value="0.1" />
        <input id="dbg-cap" type="number" step="0.05" min="0.25" max="1" value="1" /></div>
      </label>
      <label>Trend shift: ingredients / ramp seconds
        <div class="row"><input id="dbg-shift-n" type="number" step="1" min="1" max="4" value="2" />
        <input id="dbg-ramp" type="number" step="5" min="0" value="0" /></div>
      </label>
      <label class="row"><input id="dbg-autofollow" type="checkbox" /> Auto-follow (waiters follow your customers)</label>
      <label>Trend headlines name
        <select id="dbg-headline">
          <option value="all">every ingredient that shifted</option>
          <option value="none">nothing (just that tastes moved)</option>
          <option value="one">only one of them (old)</option>
        </select>
      </label>
      <label class="row"><input id="dbg-bag" type="checkbox" checked /> Report ingredients rotate (every 4 reports cover all 4)</label>
      <label class="row"><input id="dbg-verdict" type="checkbox" /> Reports include the diner's verdict 👍😐👎</label>
      <label>Seconds between arrivals <input id="dbg-arrival" type="number" step="0.1" min="0.3" value="1.2" /></label>
      <label>Seed <input id="dbg-seed" type="number" value="1" /></label>
      <label class="row"><input id="dbg-reveal" type="checkbox" /> Reveal ideal recipe</label>
      <div class="row">
        <button id="dbg-restart" class="primary">Restart with these settings</button>
        <button id="dbg-close">Close</button>
      </div>
    </div>

    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
